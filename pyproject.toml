[project]
name = "entire-graph"
version = "0.1.0"
description = "A precomputed code graph CLI tool"
authors = [{ name = "Deepu", email = "deepu@example.com" }]
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.21.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["internal", "cmd"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["cmd", "internal"]
python_files = "*_test.py"
